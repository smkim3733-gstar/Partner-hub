name: Production health

on:
  schedule:
    - cron: '23 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  anonymous-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public pages and private API boundaries
        run: node scripts/check-production-health.mjs
