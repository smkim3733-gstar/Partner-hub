name: Production health

on:
  schedule:
    # Every 6 hours. The anonymous /api/state check reads the portal state from
    # Supabase, so each run is also real database activity. One run per day
    # was not enough: the Free project was paused for inactivity in Oct 2026.
    # Supabase asks for "a few user requests to the database each day".
    - cron: '23 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  anonymous-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5 auto-caches from packageManager before pnpm is installed.
          package-manager-cache: false
      - name: Verify public pages and private API boundaries
        env:
          PARTNER_HUB_BASE_URL: https://partner-hub-gamma-five.vercel.app
        run: node scripts/check-production-health.mjs
